name: chimera waterbox core

# The core as Chimera ships it: a sandboxed core.wbx package. An official core,
# on Chimera's roster since Chimera's 9aff711 (2026-10-10), published by its
# author outside the ToolAssisted-run organisation
# (github.com/P-AS/chimera-core-srb2): it builds against Chimera's public main
# and publishes into this repository's own releases through Chimera's reusable
# publish workflow (the aarch64 fork's). Chimera's CI fetches the newest
# nightly's x64 package on every run and runs its package tests on it.
#
# SRB2's data is Sonic Team Junior's, freely distributed by them and never
# carried here: the gate downloads STJr's own 2.2.15 release
# (waterbox/fetch-data.sh, SRB2-v2215-Full.zip from github.com/STJr/SRB2) and
# checks its four pk3s against the firmware the package declares. On it: the
# native reference and the package build, fresh, from the pinned upstream with
# the patch series applied; the equivalence, steps, savestates, input, audio
# (Ogg Vorbis, GME, libopenmpt), files, exports, declaration, settings,
# resolution, opengl (with no GPU bridge, opengl-hw draws in software and
# says so) and time legs; the engine leg also runs opengl-hw through Chimera's
# GPU bridge when the runner's EGL gives a context (a runner has no GPU: llvmpipe, or a SKIP); the package through Chimera's own engine (the
# gate's engine leg) and Chimera's contract tests. Every release also carries
# lua/tasinfo.lua, the TAS info overlay for Chimera's Lua Console (the
# publish-lua job), checked to parse by the gate job.
#
# The gate runs twice, once per host CPU, on a runner of that CPU: x86-64
# against Chimera's public main, and aarch64 (miniBox's aarch64 machine)
# against the aarch64 forks of Chimera and miniBox (github.com/P-AS/chimera,
# branch aarch64, whose extern/chimera-common-minibox is
# github.com/P-AS/chimera-common-minibox). Both must pass for a release, and
# both packages are in it, each named by the leg's CPU:
# srb2-<version>-x64.chimeraCore and srb2-<version>-arm64.chimeraCore.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # 04:23 UTC. A nightly is published only when main moved since the last one;
    # the reusable workflow checks, so an unchanged core costs one idle run. Off
    # the hour: GitHub delays and drops scheduled runs under the top-of-hour
    # load, and 04:00 never fired here (2026-10-05). Actions > Run workflow
    # with kind nightly publishes one by hand.
    - cron: '23 4 * * *'

# Keyed by the EVENT as well as the ref: the nightly schedule and a push to
# main would otherwise cancel each other, and the publish that depends on the
# cancelled gate is then skipped with nothing reporting a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:

  gate:
    name: gate ${{ matrix.arch }} (package, declaration, Chimera contract)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      # one CPU's failure says nothing about the other's
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            chimera-repo: ToolAssisted-run/chimera
            chimera-ref: main
          - arch: arm64
            runner: ubuntu-26.04-arm
            chimera-repo: P-AS/chimera
            chimera-ref: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          # extern/openmpt is shallow (.gitmodules): only its pinned commit
          submodules: recursive

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.chimera-repo }}
          ref: ${{ matrix.chimera-ref }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev python3-pip curl lua5.4

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-aqt-3.3.0

      - name: Build Chimera (the engine, chimera-run and the window)
        run: chimera-checkout/tools/ci-chimera.sh "$HOME/qt"

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + C++ guest toolchain)
        # GME and libopenmpt are C++: the guest links miniBox's libstdc++. Its
        # guest toolchain is not in miniBox's default target, so it is named.
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          ninja -C "$mb/build/meson-linux" source/guest/emulibc.c.o
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"
          ninja -C "$mb/build/meson-cpp" libstdcxx-installed.stamp source/guest/emulibc.c.o source/guest/cxxglue.c.o

      - name: The Lua scripts parse
        # what publish-lua puts in every release must at least load
        run: for f in lua/*.lua; do luac5.4 -p "$f"; done

      - name: Cache SRB2 2.2.15's data
        uses: actions/cache@v4
        with:
          path: build/srb2-2.2.15
          key: srb2-2.2.15-data-${{ hashFiles('waterbox/waterbox.config') }}

      - name: Fetch SRB2 2.2.15's data
        # STJr's own release, checked against the declared firmware's SHA-1s
        run: ./waterbox/fetch-data.sh build/srb2-2.2.15

      - name: Build the native reference and the core
        env:
          MINIBOX_DIR: ${{ github.workspace }}/chimera-checkout/extern/chimera-common-minibox
        run: |
          make -C waterbox -f native.mk -j"$(nproc)"
          make -C waterbox -f guest.mk -j"$(nproc)"

      - name: Core gate
        env:
          MINIBOX_DIR: ${{ github.workspace }}/chimera-checkout/extern/chimera-common-minibox
        run: ./waterbox/run-gate.sh -d build/srb2-2.2.15 -c "$GITHUB_WORKSPACE/chimera-checkout/build"

      - name: Build and install the package
        # The commit is the core's authoritative version: this build is the one
        # that publishes the artifact, so what it stamps is what a movie can
        # cite. A package built by hand stamps "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
          MINIBOX_DIR: ${{ github.workspace }}/chimera-checkout/extern/chimera-common-minibox
        run: ./waterbox/build-package.sh -r chimera-checkout

      - name: The package through the real frontend
        # Chimera's own contract tests, run against THIS package: readable,
        # built for an ABI this frontend runs, a working factory, binding only
        # buttons its controller declares, stamping a version - and the letters
        # waterbox.config declares for its buttons all there, writable and
        # distinct.
        env:
          CHIMERA_CORES_DIR: ${{ github.workspace }}/chimera-checkout/build/Cores
        run: chimera-checkout/build/meson-linux/source/ui/test-packages

      - name: Publish the core package
        # as srb2-<sha>-<arch>: the shared publish names it for the release,
        # srb2-<version>-<arch>.chimeraCore, and checks its core.wbx is built
        # for that CPU
        uses: actions/upload-artifact@v7
        with:
          name: srb2-${{ github.sha }}-${{ matrix.arch }}
          path: chimera-checkout/build/Cores/srb2.chimeraCore
          if-no-files-found: error

      - name: Upload the gate work dir on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-work-${{ matrix.arch }}
          # the gate's outputs, not the game's data (build/gate holds links to it)
          path: |
            build/gate/*.txt
            build/gate/savedata/
            build/package-make.log

  publish:
    # What the gate passed, published as this core's own release: a rolling
    # `dev` on every green push to main, an immutable `nightly-YYYY-MM-DD` from
    # the scheduled run, each carrying both packages,
    # srb2-<version>-x64.chimeraCore and srb2-<version>-arm64.chimeraCore.
    # The logic is Chimera's tools/publish-core.sh, through the one reusable
    # workflow every core publishes with - the aarch64 fork's, which publishes
    # a package per CPU, running the fork's own publish-core.sh.
    name: publish
    needs: [ gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: P-AS/chimera/.github/workflows/publish-core.yml@aarch64
    with:
      core-id: srb2
      artifact: srb2-${{ github.sha }}
      package: srb2.chimeraCore
      arches: x64 arm64
      kind: ${{ github.event.inputs.kind }}
      chimera-repository: P-AS/chimera
      chimera-ref: aarch64

  publish-lua:
    # lua/tasinfo.lua as an asset of the release publish just made, dev or
    # nightly. Chimera's publish-core.sh uploads only the package, and deletes
    # and recreates `dev` every time, so the script goes up after it, from this
    # same commit. The release is the one publish-core.yml picks: a nightly for
    # the schedule or kind nightly, else dev; a nightly is the newest
    # nightly-* tag at this commit, by its name (the releases API makes
    # lightweight tags, whose creator date is the commit's, so the date in the
    # name is the only order); an unmoved main publishes none, and that
    # nightly, from an earlier run, gets the script if it lacks it. The notes
    # get two paragraphs: which package most users want (x64), above the table
    # that names both, and what tasinfo.lua is, at the end.
    name: publish tasinfo.lua
    needs: [ publish ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Upload it into the release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ github.event.inputs.kind }}
        run: |
          set -eu
          if [ -z "$KIND" ]; then
            if [ "${{ github.event_name }}" = schedule ]; then KIND=nightly; else KIND=dev; fi
          fi
          git fetch --tags --force --quiet
          if [ "$KIND" = dev ]; then
            tag=dev
          else
            tag=$(git tag --points-at HEAD --sort=-refname -l 'nightly-*' | head -1)
          fi
          [ -n "$tag" ] || { echo "no $KIND release at ${GITHUB_SHA}" >&2; exit 1; }
          # the API answers 5xx now and then (as publish-core.sh retries for)
          for n in 1 2 3 4; do
            gh release upload "$tag" lua/tasinfo.lua --clobber && break
            [ "$n" -lt 4 ] || exit 1
            sleep $((n * 15))
          done
          notes=$(gh release view "$tag" --json body --jq .body)
          changed=0
          # which package to take, before the table that names both
          hint='**You most likely want the x64 package.** Take the arm64 one only if you know you are using an arm64 device.'
          case "$notes" in
            *"most likely want the x64"*) ;;
            *) notes=$(printf '%s\n' "$notes" | awk -v h="$hint" '!done && /^\|/ { print h; print ""; done = 1 } { print } END { if (!done) { print ""; print h } }')
               changed=1 ;;
          esac
          case "$notes" in
            *tasinfo.lua*) ;;
            *) notes=$(printf '%s\n\n%s' "$notes" "\`tasinfo.lua\` is the TAS info overlay (speed, angle, position, momentum, spindash revs, timers, boss): open it in Chimera's **Tools > Lua Console** with an SRB2 project loaded (the README's \"Game State and the TAS info script\").")
               changed=1 ;;
          esac
          if [ "$changed" = 1 ]; then
            printf '%s\n' "$notes" > notes.md
            gh release edit "$tag" --notes-file notes.md
          fi
          echo "tasinfo.lua -> $tag"
